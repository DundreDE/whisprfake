[project]
name = "whisprfake"
version = "0.1.0"
description = "Local-only Wispr Flow clone for Arch Linux / Omarchy (Hyprland)"
requires-python = ">=3.12"
dependencies = [
  "evdev>=1.7",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "onnx-asr>=0.7",
  "httpx>=0.27",
  "pydantic>=2.8",
  "rapidfuzz>=3.9",
  "jellyfish>=1.1",
  "dbus-next>=0.2.3",
  "platformdirs>=4.2",
  "soundfile>=0.12",
  "sherpa-onnx>=1.10",
]

[project.scripts]
whisprfake = "whisprfake.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jiwer>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisprfake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
